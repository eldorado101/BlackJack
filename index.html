<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Play a fast, responsive multiplayer Blackjack game directly in your browser. Built with pure HTML, CSS & JavaScript. Features 2 human players, 2 AI opponents, and a dealer.">
  <meta name="keywords" content="blackjack game, html card game, javascript blackjack, multiplayer blackjack, browser game, github pages game, open source card game">
  <meta name="author" content="YourName">
  <meta property="og:title" content="HTML Blackjack - Multiplayer Browser Game">
  <meta property="og:description" content="Play Blackjack with friends & AI opponents. No downloads. Runs in any browser.">
  <meta property="og:type" content="website">
  <title>HTML Blackjack - Multiplayer Browser Card Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🃏 HTML Blackjack</h1>
    <p>2 Players • 2 AI • 1 Dealer • Play in Browser</p>
    <button id="newGameBtn">New Game</button>
  </header>

  <main id="gameBoard">
    <section class="area dealer">
      <h2>Dealer</h2>
      <div id="dealerHand" class="hand"></div>
      <p id="dealerStatus"></p>
    </section>

    <section class="area players">
      <div id="player1" class="player">
        <h2>Player 1 (You)</h2>
        <div class="hand"></div>
        <p class="status"></p>
      </div>
      <div id="player2" class="player">
        <h2>Player 2 (You/Friend)</h2>
        <div class="hand"></div>
        <p class="status"></p>
      </div>
      <div id="ai1" class="player ai">
        <h2>AI 1</h2>
        <div class="hand"></div>
        <p class="status"></p>
      </div>
      <div id="ai2" class="player ai">
        <h2>AI 2</h2>
        <div class="hand"></div>
        <p class="status"></p>
      </div>
    </section>

    <section id="controls">
      <button id="hitBtn" disabled>Hit</button>
      <button id="standBtn" disabled>Stand</button>
    </section>

    <section id="log">
      <h3>Game Log</h3>
      <ul id="logList"></ul>
    </section>
  </main>

  <footer>
    <p>Built by Dwight Bedsaul • Pure HTML/CSS/JS • <a href="https://github.com/eldorado101/blackjack" target="_blank">View Source</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
